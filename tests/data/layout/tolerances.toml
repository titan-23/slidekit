# 文字の配置の照合（tests/test_layout_fixture.py）で、照合ケースごとに厳しく比べる項目と許容差。
#
# 規則は tags（すべてを持つケース）か elements（"ページの識別子/要素の識別子"）で選ぶ。両方を書くと、両方に合うケースだけを選ぶ。
# reason には許容差を決めた根拠を書く。項目は次の 4 つで、書かない項目は通常の許容差で比べる。
# - baseline：行の基線。stacked = true なら、数式の字形が複数の基線に並ぶ行（分数など）の基線も比べる。
# - width：行の幅と左端。インクの左右の端も、ink_x を書かなければこの許容差で比べる。
# - ink_x：インクの左端と右端。
# - ink_y：インクの上端と下端。
# 許容差は tolerance_pt（pt）と tolerance_em（要素の最大の文字サイズの em）の大きいほうにする。どちらか 1 つは書く。
# 1 つのケースに合う複数の規則が同じ項目を書くと誤りにする。
schema_version = 1

[[rules]]
tags = ["text_baseline"]
reason = """通常文字の角括弧などを目印にした数式の行（上付きの横分数・斜線・上下の分数）。\
数式を含む行の通常の基線の許容差 max(1.5 pt, 0.1 em) は 20 pt で 2 pt になり、2026-10-23 に直した 0.8〜1.8 pt の基線のずれが通る。\
目印の通常文字が行の基線を決めるので、数式の構造によらず通常文字の行と同じ 0.5 pt で比べる。"""
baseline = { tolerance_pt = 0.5, stacked = true }
